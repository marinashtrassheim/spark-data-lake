services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - data-lake

  spark-master:
    build: .
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./apps:/opt/spark-apps
      - ./data:/opt/data
    networks:
      - data-lake
    depends_on:
      - minio
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  spark-worker:
    build: .
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    ports:
      - "8081:8081"
    volumes:
      - ./apps:/opt/spark-apps
      - ./data:/opt/data
    networks:
      - data-lake
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

  generator:
    build: ./generator
    container_name: generator
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-data-lake}
      - RAW_PREFIX=raw
    networks:
      - data-lake
    depends_on:
      minio:
        condition: service_healthy
    profiles:
      - tools

  jupyter:
    build: .
    container_name: jupyter
    ports:
      # Loopback-only: Jupyter runs with no token/password (see jupyter/*.py),
      # so this must not be reachable from other hosts on the network.
      - "127.0.0.1:8889:8888"
    volumes:
      - ./notebooks:/opt/notebooks
    environment:
      - HOME=/home/spark
      - JUPYTER_CONFIG_DIR=/home/spark/.jupyter
      - JUPYTER_TOKEN=
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
    networks:
      - data-lake
    depends_on:
      minio:
        condition: service_healthy
    command: ["/home/spark/start-notebook.sh"]

networks:
  data-lake:
    driver: bridge